<!DOCTYPE html>
<html lang="fa">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>شاه، دزد، وزیر | Shah, Thief &amp; Minister</title>
  <meta name="description" content="بازی دورهمی شاه دزد وزیر با یک گوشی: چهار حالت، پخش مخفی نقش‌ها، بدون اینترنت و بدون تبلیغ. The Shah-Thief-Minister party game for one phone: four modes, offline, no ads.">
  <meta name="theme-color" content="#0C0F2A">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="شاه دزد وزیر">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0C0F2A; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .3s; }
    #splash svg { width: 96px; height: 45px; animation: pulse 1.4s ease-in-out infinite; }
    #splash .bar { width: 120px; height: 3px; border-radius: 2px; background: #232750; overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: #D4AE55; animation: slide 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.06); opacity: .85; } }
    @keyframes slide { from { transform: translateX(-120%); } to { transform: translateX(320%); } }
    @media (prefers-reduced-motion: reduce) { #splash svg, #splash .bar i { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 64 30"><path d="M8 28L5 6l13 11L32 0l14 17L59 6l-3 22Z" fill="#D4AE55"/><circle cx="32" cy="16" r="3.5" fill="#B3243A"/></svg>
    <div class="bar"><i></i></div>
  </div>
  <noscript>این بازی به جاوااسکریپت نیاز دارد. · This game needs JavaScript.</noscript>
  <script>
    // Offline: our own service worker (sw.js, written by tools/web_build.mjs).
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 320); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
