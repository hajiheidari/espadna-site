# espadna.com on Cloudflare Workers static assets (free).
# Deployed automatically by .github/workflows/deploy.yml on every push to main.
name = "espadna-site"
compatibility_date = "2025-09-01"
routes = [
  { pattern = "espadna.com", custom_domain = true },
  { pattern = "www.espadna.com", custom_domain = true },
]

[assets]
directory = "public"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
